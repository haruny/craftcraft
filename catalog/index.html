<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CraftCraft catalog</title>
  <meta name="description" content="The catalog of Rust rewrites that the CraftCraft launcher installs.">
  <style>
    :root { color-scheme: light dark; --bg: #faf9f7; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --accent: #ea580c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --line: #292524; --accent: #fb923c; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 72px 20px; }
    h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); margin: 0 0 28px; }
    ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    a { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; color: var(--fg); text-decoration: none; }
    a:hover { color: var(--accent); }
    small { color: var(--muted); font-size: .875rem; text-align: right; }
  </style>
</head>
<body>
  <main>
    <h1>CraftCraft <span>catalog</span></h1>
    <p>The list of Rust rewrites that the CraftCraft launcher installs. Launchers read it from this address every few hours.</p>
    <ul>
      <li><a href="catalog.json">catalog.json <small>the catalog</small></a></li>
      <li><a href="https://github.com/haruny/craftcraft/releases/latest">Download CraftCraft <small>the launcher</small></a></li>
      <li><a href="https://github.com/haruny/craftcraft/blob/main/CONTRIBUTING.md">Add your app <small>a pull request to catalog.json</small></a></li>
      <li><a href="https://github.com/haruny/craftcraft">Source code <small>GitHub</small></a></li>
    </ul>
  </main>
</body>
</html>
