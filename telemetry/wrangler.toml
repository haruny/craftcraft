name = "craftcraft-telemetry"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Daily: snapshot the launcher's GitHub download counts, and delete old events.
[triggers]
crons = ["30 5 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "craftcraft-telemetry"
# From `npx wrangler d1 create craftcraft-telemetry`.
database_id = "REPLACE_WITH_DATABASE_ID"
