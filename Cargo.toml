[package]
name = "craftcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Installs, updates and opens well-known software rewritten in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/haruny/craftcraft"

[dependencies]
directories = "6.0.0"
eframe = "0.37.0"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lzma-rs = "0.3.0"
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
ureq = "3.5.0"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
winresource = "0.1.34"
